---
- name: Confirm backend can reach MySQL FQDN on port 3306
  ansible.builtin.wait_for:
    host: epicbook-db.cghoeoyw2bg6.us-east-1.rds.amazonaws.com
    port: 3306
    timeout: 30
  delegate_to: backend_server

- name: Create the application database if it does not exist
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  no_log: true

- name: Check if the Author table already exists
  ansible.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: >
      SELECT COUNT(*) AS table_count
      FROM information_schema.tables
      WHERE table_schema = %s AND table_name = 'Author'
    positional_args:
      - "{{ db_name }}"
  register: database_author_table_check
  no_log: true

- name: Import schema (only if Author table does not exist)
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "/opt/epicbook/db/BuyTheBook_Schema.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: database_author_table_check.query_result[0][0].table_count == 0
  no_log: true

- name: Check if Author seed data already exists
  ansible.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS row_count FROM Author"
  register: database_author_row_check
  no_log: true

- name: Import author seed data (only if Author table is empty)
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "/opt/epicbook/db/author_seed.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: database_author_row_check.query_result[0][0].row_count == 0
  no_log: true

- name: Check if Book seed data already exists
  ansible.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS row_count FROM Book"
  register: database_book_row_check
  no_log: true

- name: Import book seed data (only if Book table is empty)
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "/opt/epicbook/db/books_seed.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: database_book_row_check.query_result[0][0].row_count == 0
  no_log: true
