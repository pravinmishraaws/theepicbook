---
- name: Add NodeSource repository for Node.js
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_18.x
    dest: /tmp/nodesource_setup.sh
    mode: "0755"

- name: Configure NodeSource repository for Node.js
  ansible.builtin.command: bash /tmp/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js and MySQL client tools
  ansible.builtin.apt:
    name:
      - nodejs
      - mysql-client
    state: present
    update_cache: true

- name: Install rsync on backend
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true
  become: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/epicbook
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Deploy EpicBook application code
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: /opt/epicbook/
    archive: true
    use_ssh_args: true
    compress: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=ansible"
      - "--exclude=node_modules"
  delegate_to: localhost

- name: Install Node.js dependencies
  ansible.builtin.command: npm ci --production
  args:
    chdir: /opt/epicbook
    creates: /opt/epicbook/node_modules

- name: Deploy database configuration
  ansible.builtin.template:
    src: db-config.j2
    dest: /opt/epicbook/config/config.json
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  notify: Restart epicbook

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart epicbook

- name: Enable and start EpicBook service
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    state: started
    daemon_reload: true
