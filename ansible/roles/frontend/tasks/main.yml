---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy EpicBook Nginx site configuration
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable EpicBook Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook.conf
    dest: /etc/nginx/sites-enabled/epicbook.conf
    state: link
  notify: Reload nginx

- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Add NodeSource repository for Node.js
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js and MySQL client tools
  ansible.builtin.apt:
    name:
      - nodejs
      - mysql-client
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/epicbook
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Deploy EpicBook application code
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: /opt/epicbook/
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=ansible"
      - "--exclude=node_modules"

- name: Install Node.js dependencies
  ansible.builtin.command: npm ci --production
  args:
    chdir: /opt/epicbook

- name: Deploy database configuration
  ansible.builtin.template:
    src: db-config.j2
    dest: /opt/epicbook/config/config.json
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  no_log: true
  notify: Restart epicbook

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart epicbook

- name: Enable and start EpicBook service
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    state: started
    daemon_reload: true