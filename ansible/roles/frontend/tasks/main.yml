---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy EpicBook Nginx site configuration
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable EpicBook Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook.conf
    dest: /etc/nginx/sites-enabled/epicbook.conf
    state: link
  notify: Reload nginx

- name: Test Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Add NodeSource repository for Node.js
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js and MySQL client tools
  ansible.builtin.apt:
    name:
      - nodejs
      - mysql-client
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/epicbook
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Deploy EpicBook application code
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: /opt/epicbook/
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=ansible"
      - "--exclude=node_modules"

- name: Install Node.js dependencies
  ansible.builtin.command: npm ci --production
  args:
    chdir: /opt/epicbook

- name: Deploy database configuration
  ansible.builtin.template:
    src: db-config.j2
    dest: /opt/epicbook/config/config.json
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  no_log: true
  notify: Restart epicbook

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart epicbook

- name: Enable and start EpicBook service
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    state: started
    daemon_reload: true

- name: Confirm database can reach MySQL FQDN on port 3306
  ansible.builtin.wait_for:
    host: "{{ mysql_fqdn }}"
    port: 3306
    timeout: 10

- name: Create the application database if it does not exist
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  no_log: true

- name: Check if the Author table already exists
  community.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: >
      SELECT COUNT(*) AS table_count
      FROM information_schema.tables
      WHERE table_schema = %s AND table_name = 'Author'
    positional_args:
      - "{{ db_name }}"
  register: author_table_check
  no_log: true

- name: Import schema (only if Author table does not exist)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "/opt/epicbook/db/BuyTheBook_Schema.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: author_table_check.query_result[0][0].table_count == 0
  no_log: true

- name: Check if Author seed data already exists
  community.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS row_count FROM Author"
  register: author_row_check
  no_log: true

- name: Import author seed data (only if Author table is empty)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "/opt/epicbook/db/author_seed.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: author_row_check.query_result[0][0].row_count == 0
  no_log: true

- name: Check if Book seed data already exists
  community.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS row_count FROM Book"
  register: book_row_check
  no_log: true

- name: Import book seed data (only if Book table is empty)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "/opt/epicbook/db/books_seed.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: book_row_check.query_result[0][0].row_count == 0
  no_log: true
